name: CI

on:
  push:
  pull_request:

# The jobs only read the repository. A token that can't write limits what a
# compromised action or dependency could do with it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commits rather than tags: a tag can be moved, a commit can't.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Lets RdbTest check that a real redis-server can load our snapshots.
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t redis-java .
      - name: Check it becomes healthy and stops cleanly
        run: |
          docker run -d --name redis redis-java
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' redis)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' redis | grep -qx healthy
          [ "$(docker exec redis id -un)" = redis ]
          docker stop redis
          docker logs redis
          [ "$(docker inspect -f '{{.State.ExitCode}}' redis)" = 0 ]
